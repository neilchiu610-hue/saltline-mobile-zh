<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <title>盐线行动 · 横屏版</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f;overscroll-behavior:none}
    #screen{position:fixed;inset:0;overflow:hidden;touch-action:none}
    #safe-area{position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px)}
    iframe{position:absolute;left:50%;top:50%;border:0;display:block;transform-origin:center;touch-action:none;color-scheme:dark}
  </style>
</head>
<body>
  <div id="screen"><div id="safe-area"><iframe id="game" title="盐线行动横屏游戏" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
  <script>
    (()=>{
      'use strict';
      const screen=document.querySelector('#screen'),safe=document.querySelector('#safe-area'),frame=document.querySelector('#game');
      let reverse=false,angle=0,previousAngle=null,queued=false;
      try{reverse=sessionStorage.getItem('saltline.landscape.reverse')==='1'}catch{}
      function layout(){
        queued=false;
        const viewport=window.visualViewport;
        screen.style.width=(viewport?.width||innerWidth)+'px';
        screen.style.height=(viewport?.height||innerHeight)+'px';
        screen.style.transform=`translate(${viewport?.offsetLeft||0}px,${viewport?.offsetTop||0}px)`;
        const width=safe.clientWidth,height=safe.clientHeight,portrait=height>width;
        angle=portrait?(reverse?-90:90):0;
        frame.style.width=(portrait?height:width)+'px';
        frame.style.height=(portrait?width:height)+'px';
        frame.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
        document.documentElement.dataset.rotation=String(angle);
        // Reset held touches only when their coordinate system actually rotates.
        // Keep the same frame/mission alive across rotation and Safari toolbar changes.
        if(previousAngle!==null&&previousAngle!==angle){
          frame.contentWindow?.dispatchEvent(new Event('orientationchange'));
        }
        previousAngle=angle;
        frame.contentWindow?.dispatchEvent(new Event('saltline:layout'));
      }
      function schedule(){if(!queued){queued=true;requestAnimationFrame(layout)}}
      window.SaltlineLandscape={
        get angle(){return angle},
        flip(){reverse=!reverse;try{sessionStorage.setItem('saltline.landscape.reverse',reverse?'1':'0')}catch{}layout()}
      };
      addEventListener('resize',schedule);
      addEventListener('orientationchange',schedule);
      visualViewport?.addEventListener('resize',schedule);
      visualViewport?.addEventListener('scroll',schedule);
      new ResizeObserver(schedule).observe(safe);
      layout();
      frame.src='../index.html?landscape=1&v=4';
    })();
  </script>
</body>
</html>
